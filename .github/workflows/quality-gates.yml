name: Quality Gates

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint-typecheck-build:
    name: Test, Lint, Typecheck, Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Financial and research regression tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          SEC_USER_AGENT: EDGAR Terminal CI https://github.com/EconometricsEdward/sec-edgar-terminal
